name: finetune_zenodo
# Fine-tune the Figshare no-pad checkpoints on the Zenodo PCOSgen dataset.
# Loads each existing best.pt via --resume in scripts/sweep_finetune.py,
# trains for 15 epochs on Zenodo train (2560) with val on Zenodo val (640),
# then evaluates on the held-out Zenodo test (1468).
#
# Preprocessing is paired with the Figshare checkpoint: srad_nopad -> srad_nopad,
# gauss_nopad -> gauss_nopad. The Zenodo images are preprocessed on-the-fly
# inside the dataloader (no pre-baked .npy files).
mode: finetune
preprocessing:
  - srad_nopad
  - gauss_nopad
models:
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - convnext_tiny
  - mobilenetv3_large
  - vit_base
  - swin_tiny
training:
  optimizer: adamw
  # Lower than Figshare 1e-4: the network is already near a good minimum,
  # so we want a small step to adapt to the new domain without catastrophic
  # forgetting. HPO will refine this further.
  lr: 3.0e-5
  weight_decay: 1.0e-3
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 15
  early_stopping_patience: 5
  warmup_epochs: 1
  freeze_epochs: 0
  monitor: val_auc
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  sampler: weighted
  # Reduce disk footprint: keep only best.pt, no rolling window.
  keep_last_n: 1
seed: 42
results_dir: results/finetune_zenodo/
# Zenodo split source — paths are read from these JSONs in scripts/sweep_finetune.py.
data:
  train_split: data_external/zenodo_splits/train.json
  val_split: data_external/zenodo_splits/val.json
  # Path to the held-out external test set (the dataset_root evaluate_external
  # uses with --layout zenodo_labeled).
  external_dir: data_external/test
  external_layout: zenodo_labeled
  # Where the Figshare-trained checkpoints live (the resume-from source).
  resume_root: results/ablation_nopad/checkpoints/
