name: tune_best_model
model: efficientnet_b4
preprocessing: full_ad
n_trials: 50
direction: maximize
metric: val_auc
sampler: tpe
pruner: median
pruner_warmup_steps: 5

search_space:
  lr:
    type: loguniform
    low: 1.0e-5
    high: 1.0e-3
  weight_decay:
    type: loguniform
    low: 1.0e-4
    high: 1.0e-1
  dropout:
    type: uniform
    low: 0.3
    high: 0.7
  freeze_fraction:
    type: categorical
    choices: [0.40, 0.50, 0.60, 0.70]
  batch_size:
    type: categorical
    choices: [16, 32, 64]

# Fixed (not tuned):
max_epochs: 100
early_stopping_patience: 20
scheduler: cosine_annealing
seed: 42
results_dir: results/tuning/
