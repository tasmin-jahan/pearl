name: tune_best_model
# v3: tuning is now per-architecture (Phase 6.1) on the entire 9-model
# roster. This config tunes one specific architecture; for the full
# sweep use tune_per_arch.yaml.
model: swin_tiny
preprocessing: srad
n_trials: 50
direction: maximize
metric: val_auc
sampler: tpe
pruner: median
pruner_warmup_steps: 5

search_space:
  lr:
    type: loguniform
    low: 1.0e-5
    high: 1.0e-3
  weight_decay:
    type: loguniform
    low: 1.0e-4
    high: 1.0e-1
  dropout:
    type: uniform
    low: 0.3
    high: 0.7
  freeze_fraction:
    type: categorical
    choices: [0.40, 0.50, 0.60, 0.70]
  batch_size:
    type: categorical
    choices: [16, 32, 64]

# Fixed (not tuned):
max_epochs: 100
early_stopping_patience: 20
warmup_epochs: 2
freeze_epochs: 1
scheduler: cosine_annealing
bf16: true
channels_last: true
grad_clip_norm: 1.0
ema: true
seed: 42
results_dir: results/tuning/
