name: best_model_xai
mode: single
# v3: best model slot is filled post-sweep; swin_tiny is a placeholder
# default that you overwrite via --model once the sweep winners are known.
model: swin_tiny
preprocessing: srad
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  warmup_epochs: 2
  freeze_epochs: 1
  monitor: val_auc
  mc_dropout_passes: 50
  ece_bins: 15
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  ema_decay: 0.999
  # Class-imbalance sampler: "shuffle" (default) | "weighted" | "none".
  # Use "weighted" when imbalance > 3x (post-dedup PCOS is 3.92x).
  sampler: weighted
seed: 42
results_dir: results/
