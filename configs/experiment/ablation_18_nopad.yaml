name: preprocessing_ablation_18_nopad
# Same as ablation_18.yaml but with padding: "none" preprocessings
# (srad_nopad, gauss_nopad). The model is trained on hard stretch-resize
# to 224x224 with NO letterbox strip. If the border-shortcut hypothesis
# (Findings 7 & 8) is the cause of the PCOSgen collapse, this run should
# recover external AUC at or above 0.85.
mode: ablation
preprocessing:
  - srad_nopad
  - gauss_nopad
models:
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - convnext_tiny
  - mobilenetv3_large
  - vit_base
  - swin_tiny
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  warmup_epochs: 2
  freeze_epochs: 1
  monitor: val_auc
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  sampler: weighted
seed: 42
results_dir: results/ablation_nopad/
