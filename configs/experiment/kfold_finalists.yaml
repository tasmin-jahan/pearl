name: kfold_finalists
# v3 Phase 6.3: k-fold cross-validation is applied only to top-k
# finalists identified by the Phase 6.1 sweep (default k=5).
mode: kfold
finalists:
  - resnet50
  - resnet101
  - densenet121   # placeholder — overwrite after HPO sweep
n_folds: 5
preprocessing: srad_clahe
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  warmup_epochs: 2
  freeze_epochs: 1
  monitor: val_auc
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  # SWA (Phase 6.4)
  swa: true
  swa_start_epoch: 60
  swa_lr: 1.0e-5
seed: 42
results_dir: results/kfold/
