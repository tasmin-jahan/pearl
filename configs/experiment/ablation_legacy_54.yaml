name: full_sweep
mode: sweep
# =========================================================================
# LEGACY — DO NOT USE FOR v3 EXPERIMENTS
# =========================================================================
# This config was the v1/v2 "sweep_all_54" (9 archs x 6 preprocessing
# configs = 54 runs, default hyperparameters throughout).
#
# v3 replaced this with TWO distinct experiments:
#   - ablation_18.yaml          (Phase 0: SRAD vs Gaussian only, 18 runs)
#   - tune_per_arch.yaml        (Phase 2: per-architecture Optuna HPO)
#
# Renamed from sweep_all_54.yaml to make the v3 distinction clear. Kept
# in the repo for backward compatibility with any cached results.
# =========================================================================
models:
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - convnext_tiny
  - mobilenetv3_large
  - vit_base
  - swin_tiny
preprocessing:
  - raw
  - clahe_only
  - clahe_gaussian
  - clahe_ad
  - full_gaussian
  - full_ad
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  monitor: val_auc
  mc_dropout_passes: 50
  ece_bins: 15
seed: 42
results_dir: results/legacy_54/
