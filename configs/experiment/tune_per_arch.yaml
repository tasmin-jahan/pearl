name: tune_per_arch
# v3 Phase 6.1: a single full Optuna sweep across all 9 architectures.
# This is "sweep All-9" — not a single-model tuning.
mode: sweep_tune
models:
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - convnext_tiny
  - mobilenetv3_large
  - vit_base
  - swin_tiny
preprocessing: srad_clahe  # winning preprocessing only (Phase 0.4)
n_trials_per_arch: 20       # per-architecture trial budget
top_k_finalists: 3          # only top-k proceed to k-fold (Phase 6.2/3)
direction: maximize
metric: val_auc
pruner: median
pruner_warmup_steps: 5

search_space:
  lr:
    type: loguniform
    low: 1.0e-5
    high: 1.0e-3
  weight_decay:
    type: loguniform
    low: 1.0e-4
    high: 1.0e-1
  dropout:
    type: uniform
    low: 0.3
    high: 0.7
  freeze_fraction:
    type: categorical
    choices: [0.40, 0.50, 0.60, 0.70]
  batch_size:
    type: categorical
    choices: [16, 32, 64]

# Fixed:
max_epochs: 100
early_stopping_patience: 20
warmup_epochs: 2
freeze_epochs: 1
scheduler: cosine_annealing
bf16: true
channels_last: true
grad_clip_norm: 1.0
ema: true
seed: 42
results_dir: results/sweep_hpo/
