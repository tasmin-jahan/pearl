name: preprocessing_ablation_18
# v3 Phase 0.4 ablation: 9 architectures × 2 denoising configs (SRAD,
# Gaussian) = 18 runs, no HPO. Default hyperparameters throughout.
# Whichever config wins on val AUC across the 9 models is locked in
# for Phase 6 sweep + downstream.
mode: ablation
preprocessing:
  - srad_clahe
  - gaussian_clahe
models:
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - convnext_tiny
  - mobilenetv3_large
  - vit_base
  - swin_tiny
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  warmup_epochs: 2
  freeze_epochs: 1
  monitor: val_auc
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  # Class-imbalance sampler (post-dedup imbalance = 3.92x)
  sampler: weighted
seed: 42
results_dir: results/ablation/
