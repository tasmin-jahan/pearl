name: finetune_hpo
# Optuna HPO configuration for fine-tuning on Zenodo PCOSgen.
# Used by scripts/sweep_hpo.py after the fine-tune sweep identifies the top-3
# (preprocessing, arch) finalists.
#
# HPO resumes from the corresponding fine-tuned checkpoint (NOT from ImageNet),
# so trials only search the small space around the fine-tune convergence point.
# The search space covers LR, weight decay, dropout, augmentation rotation,
# label smoothing, freeze_fraction, and batch size.
#
# Usage:
#   python scripts/sweep_hpo.py \
#     --experiment configs/experiment/finetune_hpo.yaml \
#     --out_dir results/finetune_hpo/<prep>_<arch>/
#
# IMPORTANT: `model` and `preprocessing` are single-arch, single-prep fields
# (the per-arch config is generated by `scripts/sweep_hpo.py` over the top-3
# finalists). In practice you will copy this YAML three times into
# configs/experiment/finetune_hpo_<prep>_<arch>.yaml.
mode: finetune_hpo
preprocessing: srad_nopad              # overridden by per-arch config
model: resnet50                        # overridden by per-arch config
training:
  optimizer: adamw
  lr: 3.0e-5                           # overridden by Optuna
  weight_decay: 1.0e-3                 # overridden by Optuna
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32                       # overridden by Optuna
  max_epochs: 10                       # HPO trials are short
  early_stopping_patience: 4
  warmup_epochs: 1
  freeze_epochs: 0
  monitor: val_auc
  bf16: true
  channels_last: true
  grad_clip_norm: 1.0
  ema: true
  sampler: weighted
  # augmentation overrides (rotation + label smoothing are HPO variables)
  augmentation:
    rotation: 10
    horizontal_flip: true
    scale: 0.1
seed: 42
results_dir: results/finetune_hpo/
data:
  train_split: data_external/zenodo_splits/train.json
  val_split: data_external/zenodo_splits/val.json
  resume_root: results/finetune_zenodo/checkpoints/
  # HPO trials resume from <resume_root>/<preprocessing>/<model>/best.pt
  # This is filled in by the per-arch generator script (see scripts/run_hpo_finetune.py).
  fine_tune_resume_from: results/finetune_zenodo/checkpoints/srad_nopad/resnet50/best.pt
n_trials_per_arch: 25
top_k_finalists: 3
pruner: median
pruner_warmup_steps: 3
search_space:
  lr:               {low: 5.0e-6, high: 1.0e-4}
  weight_decay:     {low: 1.0e-5, high: 1.0e-2}
  dropout:          {low: 0.0,    high: 0.5}
  rotation:         {low: 0,      high: 20}
  label_smoothing:  {low: 0.0,    high: 0.1}
  freeze_fraction:  {choices: [0.0, 0.5]}
  batch_size:       {choices: [16, 32, 64]}
