name: full_sweep
mode: sweep
models:
  - vgg16
  - vgg19
  - resnet50
  - resnet101
  - densenet121
  - densenet169
  - efficientnet_b0
  - efficientnet_b4
  - inception_v3
preprocessing:
  - raw
  - clahe_only
  - clahe_gaussian
  - clahe_ad
  - full_gaussian
  - full_ad
training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  scheduler: cosine_annealing
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 20
  monitor: val_auc
  mc_dropout_passes: 50
  ece_bins: 15
seed: 42
results_dir: results/
