name: srad_nopad
# Same as srad but the resize step does NOT letterbox the shorter side.
# The model sees a hard stretch-resize to 224x224 with no padding strip —
# this is the legacy v1/v2 behaviour. If the cross-dataset collapse is
# caused by the reflect-padding letterbox shortcut (see Finding 7/8),
# training without padding should recover external AUC.
steps:
  resize: true
  padding: none
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_size:
    - 8
    - 8
  srad:
    enabled: true
    iterations: 20
    kappa: 30
    gamma: 0.1
  anisotropic_diffusion:
    enabled: false
  gaussian:
    enabled: false
  zscore_normalize:
    enabled: true
augmentation:
  rotation: 15
  horizontal_flip: true
  scale: 0.1
  jpeg_compression:
    enabled: true
    p: 0.3
    q_low: 50
    q_high: 95
  light_blur:
    enabled: true
    p: 0.2
    sigma_low: 0.1
    sigma_high: 1.5
output_dir: results/preprocessed/srad_nopad
