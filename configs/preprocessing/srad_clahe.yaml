name: srad_clahe
# v3 standard preprocessing: CLAHE + SRAD (Speckle-Reducing Anisotropic
# Diffusion) + Z-score. SRAD is the right diffusion family for ultrasound's
# multiplicative speckle noise. CLAHE is fixed in both ablation arms.
steps:
  resize: true
  clahe: {enabled: true, clip_limit: 2.0, tile_size: [8, 8]}
  gaussian: {enabled: false}
  srad: {enabled: true, iterations: 20, kappa: 30, gamma: 0.1}
  anisotropic_diffusion: {enabled: false}
  zscore_normalize: {enabled: true}
augmentation:
  rotation: 15
  horizontal_flip: true
  scale: 0.10
output_dir: results/preprocessed/srad_clahe
