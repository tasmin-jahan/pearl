name: srad_nopad_gray
# Same as srad_nopad but the post-SRAD image is collapsed to a single
# intensity channel (mean across BGR), then broadcast back to 3 channels
# so the network still sees a 3-channel tensor. This forces the model to
# rely on intensity rather than colour-of-tissue, and combines the
# no-padding fix with the colour-deconfounded input.
steps:
  resize: true
  padding: none
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_size:
    - 8
    - 8
  srad:
    enabled: true
    iterations: 20
    kappa: 30
    gamma: 0.1
  anisotropic_diffusion:
    enabled: false
  gaussian:
    enabled: false
  to_grayscale:
    enabled: true
    method: mean
    broadcast_3ch: true
  zscore_normalize:
    enabled: true
augmentation:
  rotation: 15
  horizontal_flip: true
  scale: 0.1
  jpeg_compression:
    enabled: true
    p: 0.3
    q_low: 50
    q_high: 95
  light_blur:
    enabled: true
    p: 0.2
    sigma_low: 0.1
    sigma_high: 1.5
output_dir: results/preprocessed/srad_nopad_gray