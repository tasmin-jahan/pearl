name: gauss_nopad
# Same as gauss but the resize step does NOT letterbox the shorter side.
# See srad_nopad.yaml for the full rationale.
steps:
  resize: true
  padding: none
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_size:
    - 8
    - 8
  gaussian:
    enabled: true
    sigma: 1.0
  srad:
    enabled: false
  anisotropic_diffusion:
    enabled: false
  zscore_normalize:
    enabled: true
augmentation:
  rotation: 15
  horizontal_flip: true
  scale: 0.1
  jpeg_compression:
    enabled: true
    p: 0.3
    q_low: 50
    q_high: 95
  light_blur:
    enabled: true
    p: 0.2
    sigma_low: 0.1
    sigma_high: 1.5
output_dir: results/preprocessed/gauss_nopad
