name: srad
steps:
  resize: true
  clahe:
    enabled: true
    clip_limit: 2.0
    tile_size:
    - 8
    - 8
  gaussian:
    enabled: false
  srad:
    enabled: true
    iterations: 20
    kappa: 30
    gamma: 0.1
  anisotropic_diffusion:
    enabled: false
  zscore_normalize:
    enabled: true
  padding: reflect
augmentation:
  rotation: 15
  horizontal_flip: true
  scale: 0.1
  jpeg_compression:
    enabled: true
    p: 0.3
    q_low: 50
    q_high: 95
  light_blur:
    enabled: true
    p: 0.2
    sigma_low: 0.1
    sigma_high: 1.5
output_dir: results/preprocessed/srad
