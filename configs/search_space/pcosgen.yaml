search_space:
  lr:
    type: float
    low: 1.0e-5
    high: 1.0e-4
    log: true
  weight_decay:
    type: float
    low: 1.0e-5
    high: 1.0e-2
    log: true
  dropout:
    type: float
    low: 0.1
    high: 0.7
  freeze_fraction:
    type: categorical
    choices: [0.0, 0.3, 0.5, 0.6, 0.8]
  batch_size:
    type: categorical
    choices: [16, 32, 64]
