model:
  name: densenet121
  timm_name: densenet121
  input_size: 224
  pretrained: true
  num_classes: 2
  freeze_fraction: 0.0
  head:
    hidden_dim: 256
    dropout: 0.0035988467000480848
preprocessing:
  name: srad_nopad
  steps:
    resize: true
    padding: none
    clahe:
      enabled: true
      clip_limit: 2.0
      tile_size:
      - 8
      - 8
    srad:
      enabled: true
      iterations: 20
      kappa: 30
      gamma: 0.1
    anisotropic_diffusion:
      enabled: false
    gaussian:
      enabled: false
    zscore_normalize:
      enabled: true
  augmentation:
    rotation: 15
    horizontal_flip: true
    scale: 0.1
    jpeg_compression:
      enabled: true
      p: 0.3
      q_low: 50
      q_high: 95
    light_blur:
      enabled: true
      p: 0.2
      sigma_low: 0.1
      sigma_high: 1.5
  output_dir: results/preprocessed/srad_nopad
hpo_params:
  lr: 1.0039369272987676e-05
  weight_decay: 0.0010793153738284137
  dropout: 0.0035988467000480848
  rotation: 0
  label_smoothing: 0.013248311775154101
  freeze_fraction: 0.0
  batch_size: 16
experiment:
  max_epochs: 15
  seed: 42
seed: 42
