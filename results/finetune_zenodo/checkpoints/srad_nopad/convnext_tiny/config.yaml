model:
  name: convnext_tiny
  timm_name: convnext_tiny
  input_size: 224
  pretrained: true
  num_classes: 2
  freeze_fraction: 0.0
  head:
    hidden_dim: 256
    dropout: 0.3094930096246087
preprocessing:
  name: srad_nopad
  steps:
    resize: true
    padding: none
    clahe:
      enabled: true
      clip_limit: 2.0
      tile_size:
      - 8
      - 8
    srad:
      enabled: true
      iterations: 20
      kappa: 30
      gamma: 0.1
    anisotropic_diffusion:
      enabled: false
    gaussian:
      enabled: false
    zscore_normalize:
      enabled: true
  augmentation:
    rotation: 15
    horizontal_flip: true
    scale: 0.1
    jpeg_compression:
      enabled: true
      p: 0.3
      q_low: 50
      q_high: 95
    light_blur:
      enabled: true
      p: 0.2
      sigma_low: 0.1
      sigma_high: 1.5
  output_dir: results/preprocessed/srad_nopad
hpo_params:
  lr: 6.6219186068968326e-06
  weight_decay: 0.0011876598801919714
  dropout: 0.3094930096246087
  rotation: 13
  label_smoothing: 0.02959271508407553
  freeze_fraction: 0.0
  batch_size: 32
experiment:
  max_epochs: 15
  seed: 42
seed: 42
